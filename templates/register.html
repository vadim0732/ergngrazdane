{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<form method="post" class="form">
  <h1>Регистрация</h1>
  <label>Логин
    <input name="login" required minlength="3" value="{{ form.login or '' }}">
  </label>
  <label>Пароль
    <input type="password" name="password" required minlength="6">
  </label>
  <label>ФИО
    <input name="full_name" required value="{{ form.full_name or '' }}">
  </label>
  <label>Телефон
    <input name="phone" required value="{{ form.phone or '' }}">
  </label>
  <label>E-mail
    <input type="email" name="email" required value="{{ form.email or '' }}">
  </label>
  <button class="btn" type="submit">Зарегистрироваться</button>
  <p class="muted" style="margin-top:10px">Уже есть аккаунт?
    <a href="{{ url_for('login') }}">Войти</a></p>
</form>
{% endblock %}
